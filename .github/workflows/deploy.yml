name: Deploy ACR Cooper

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Načtení projektu
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalace
        run: npm install

      - name: Sestavení aplikace
        run: npm run build

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrání sestavené aplikace
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Zveřejnění
        id: deployment
        uses: actions/deploy-pages@v4
