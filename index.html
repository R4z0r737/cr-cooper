<!doctype html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020617"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AČR Cooper"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>AČR Cooper</title><style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom));background:linear-gradient(#020617,#07111f)}.wrap{max-width:520px;margin:auto}.head{padding:16px 0;border-bottom:1px solid #334155}.title{font-size:24px;font-weight:900}.sub{font-size:12px;color:#94a3b8}.card{margin:12px 0;padding:16px;border:1px solid #334155;border-radius:22px;background:linear-gradient(#111c2f,#0e1728);box-shadow:0 12px 30px #0005}.menu{width:100%;height:72px;margin:10px 0;border:1px solid #334155;border-radius:20px;background:#111c2f;color:white;text-align:left;padding:0 18px;font-size:18px;font-weight:900}.icon{display:inline-grid;place-items:center;width:44px;height:44px;margin-right:12px;border-radius:14px;background:#34d399;color:#022c22}.btn{height:50px;border:0;border-radius:16px;padding:0 15px;font-weight:900}.green{background:#34d399;color:#022c22}.gray{background:#334155;color:white}.red{background:#ef4444;color:white}.full{width:100%}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.field{width:100%;height:48px;border:1px solid #475569;border-radius:15px;background:#1e293b;color:white;padding:0 13px;font-size:16px}.hidden{display:none}.foot{position:fixed;left:0;right:0;bottom:0;padding:12px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));background:#020617ee;border-top:1px solid #334155}.clock{text-align:center;font:900 56px ui-monospace,monospace}.runner{display:flex;align-items:center;gap:10px}.badge{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#34d399;color:#022c22;font-weight:900}.small{color:#94a3b8;font-size:12px}.total{color:#6ee7b7;font-weight:900}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:54px;border:0;border-radius:15px;background:#334155;color:white;font-size:20px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{height:44px;border:1px solid #475569;border-radius:14px;background:#1e293b;color:white;font-weight:900}.tab.on{background:#34d399;color:#022c22}.toast{padding:10px;border-radius:14px;background:#34d399;color:#022c22;font-weight:900}.year{width:100%;height:44px;border-radius:14px;background:#1e293b;color:white;border:1px solid #475569;padding:0 12px}.back{background:none;border:0;color:white;font-size:24px}.danger{background:none;border:0;color:#f87171;font-weight:900}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-top:1px solid #334155;text-align:center}th:first-child,td:first-child{text-align:left}
</style></head><body><div id="root"></div><script>
const K='acr-cooper-pwa-v1';let tests=JSON.parse(localStorage.getItem(K)||'[]'), screen='menu', active=null, year=+(localStorage.getItem(K+'-year')||2026), timer=null,startAt=0,elapsed=0;
const save=()=>localStorage.setItem(K,JSON.stringify(tests)); const id=()=>Date.now()+'-'+Math.random().toString(36).slice(2); const n=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); const fmt=ms=>{let x=Math.floor(ms/10),s=Math.floor(x/100);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(x%100).padStart(2,'0')};
function header(t,s,b=true){return `<div class="head">${b?'<button class="back" onclick="goMenu()">‹</button>':''}<span class="title">${t}</span><div class="sub">${s||''}</div></div>`} function goMenu(){screen='menu';render()} function setYear(v){year=+v;localStorage.setItem(K+'-year',year);render()}
function render(){let r=document.getElementById('root');if(screen==='menu')r.innerHTML=`<div class="app"><div class="wrap">${header('AČR Cooper','Běžecké testy',false)}<select class="year" onchange="setYear(this.value)">${Array.from({length:15},(_,i)=>2026+i).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select><div style="text-align:center;font-size:58px;margin:30px">🏃</div>${[['tests','📋','Evidence testů'],['people','👥','Evidence běžců'],['norms','📊','Normy'],['settings','⚙️','Nastavení']].map(a=>`<button class="menu" onclick="screen='${a[0]}';render()"><span class="icon">${a[1]}</span>${a[2]}</button>`).join('')}</div></div>`;else if(screen==='tests')renderTests(r);else if(screen==='new')renderNew(r);else if(screen==='runners')renderRunners(r);else if(screen==='measure')renderMeasure(r);else if(screen==='results')renderResults(r);else if(screen==='people')renderPeople(r);else if(screen==='norms')renderNorms(r);else r.innerHTML=`<div class="app"><div class="wrap">${header('Nastavení','Vzhled aplikace')}<div class="card">Tmavý motiv je aktivní. Světlý motiv bude doplněn v další aktualizaci.</div></div></div>`}
function renderTests(r){let list=tests.filter(t=>String(t.date).startsWith(year+'-'));r.innerHTML=`<div class="app"><div class="wrap">${header('Evidence testů','Rok '+year)}<select class="year" onchange="setYear(this.value)">${Array.from({length:15},(_,i)=>2026+i).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>${list.map(t=>`<div class="card"><button style="all:unset;display:block;width:100%" onclick="active='${t.id}';screen='${t.status==='finished'?'results':'measure'}';render()"><b>${t.name}</b><div class="small">${t.date} · ${t.trackLength} m · ${t.runners.length} běžců</div></button><button class="danger" onclick="if(confirm('Opravdu smazat test?')){tests=tests.filter(x=>x.id!=='${t.id}');save();render()}">Smazat</button></div>`).join('')||'<div class="card">Žádný test v tomto roce.</div>'}</div><div class="foot"><div class="wrap"><button class="btn green full" onclick="screen='new';render()">+ NOVÝ TEST</button></div></div></div>`}
function renderNew(r){r.innerHTML=`<div class="app"><div class="wrap">${header('Nový test','Základní údaje')}<div class="card"><input id="tn" class="field" value="Cooperův test"><input id="td" class="field" type="date" value="${year}-09-15" style="margin-top:8px"><select id="tl" class="field" style="margin-top:8px"><option>200</option><option>300</option><option selected>400</option><option>407</option></select></div></div><div class="foot"><div class="wrap"><button class="btn green full" onclick="createNewTest()">POKRAČOVAT</button></div></div></div>`}
function createNewTest(){
  const nameEl=document.getElementById('tn');
  const dateEl=document.getElementById('td');
  const lengthEl=document.getElementById('tl');
  if(!nameEl||!dateEl||!lengthEl){alert('Formular se nepodarilo nacist. Obnovte stranku.');return;}
  const name=nameEl.value.trim();
  const testDate=dateEl.value;
  const trackLength=Number(lengthEl.value);
  if(!name){alert('Zadejte nazev testu.');return;}
  if(!testDate){alert('Vyberte datum testu.');return;}
  if(!trackLength||trackLength<1){alert('Vyberte delku drahy.');return;}
  const t={id:id(),name:name,date:testDate,trackLength:trackLength,runners:[],elapsedMs:0,status:'runners',createdAt:Date.now()};
  tests.push(t);save();active=t.id;screen='runners';render();
}
function cur(){return tests.find(t=>t.id===active)} function renderRunners(r){let t=cur();r.innerHTML=`<div class="app"><div class="wrap">${header('Přidat běžce',t.name)}<div class="card row"><input id="rn" class="field" placeholder="Číslo" style="max-width:95px"><input id="rname" class="field" placeholder="Jméno a příjmení"></div><button class="btn green full" onclick="if(rn.value&&rname.value){t.runners.push({id:id(),number:rn.value,name:rname.value,laps:0,extraMeters:0});save();render()}">+ PŘIDAT BĚŽCE</button>${t.runners.map(x=>`<div class="card runner"><div class="badge">${x.number}</div><b class="grow">${x.name}</b></div>`).join('')}</div><div class="foot"><div class="wrap"><button class="btn green full" onclick="screen='measure';render()">PŘEJÍT K MĚŘENÍ</button></div></div></div>`}
function startTimer(){if(timer)return;startAt=performance.now()-elapsed;timer=setInterval(()=>{elapsed=performance.now()-startAt;document.getElementById('clock').textContent=fmt(elapsed)},30)}function stopTimer(){clearInterval(timer);timer=null;let t=cur();t.elapsedMs=Math.floor(elapsed);save()}function addLap(x){let t=cur(),rr=t.runners.find(r=>r.id===x);rr.laps++;save();renderMeasure(document.getElementById('root'))}
function renderMeasure(r){let t=cur();elapsed=t.elapsedMs||elapsed;r.innerHTML=`<div class="app"><div class="wrap">${header('Měření',t.name)}<div class="card"><div id="clock" class="clock">${fmt(elapsed)}</div><div class="grid3"><button class="btn green" onclick="startTimer()">START</button><button class="btn red" onclick="stopTimer()">STOP</button><button class="btn gray" onclick="stopTimer();elapsed=0;t.elapsedMs=0;save();render()">RESET</button></div></div>${t.runners.map(x=>`<div class="card runner"><button class="badge" onclick="addLap('${x.id}')">${x.number}</button><div class="grow"><b>${x.name}</b><div class="total">${x.laps} kol · ${x.laps*t.trackLength} m</div></div><button class="btn green" onclick="addLap('${x.id}')">+</button></div>`).join('')}</div><div class="foot"><div class="wrap"><button class="btn white full" onclick="stopTimer();t.status='finished';save();screen='results';render()">UKONČIT A VYHODNOTIT</button></div></div></div>`}
function renderResults(r){let t=cur();r.innerHTML=`<div class="app"><div class="wrap">${header('Výsledky',t.name)}${t.runners.map(x=>{let total=x.laps*t.trackLength+(+x.extraMeters||0);return `<div class="card"><b>${x.number} · ${x.name}</b><div>${x.laps} kol × ${t.trackLength} m</div><div class="total">${total} m</div><input class="field" type="number" placeholder="Metry navíc" value="${x.extraMeters||''}" onchange="let z=cur().runners.find(q=>q.id==='${x.id}');z.extraMeters=+this.value;save();render()"></div>`}).join('')}</div><div class="foot"><div class="wrap"><button class="btn green full" onclick="screen='tests';render()">ULOŽIT TEST</button></div></div></div>`}
function renderPeople(r){let map={};tests.forEach(t=>t.runners.forEach(x=>{let k=n(x.name),total=x.laps*t.trackLength+(+x.extraMeters||0);(map[k]??={name:x.name,res:[]}).res.push({date:t.date,total})}));let p=Object.values(map);r.innerHTML=`<div class="app"><div class="wrap">${header('Evidence běžců','Počet běžců: '+p.length)}<input id="pq" class="field" placeholder="Hledat běžce" oninput="renderPeople(document.getElementById('root'))">${p.map(x=>`<div class="card"><b>${x.name}</b><div class="total">${Math.max(...x.res.filter(a=>a.date.startsWith(year)).map(a=>a.total),0)} m</div><div class="small">Celkem běhů: ${x.res.length}</div></div>`).join('')}</div></div>`}
function renderNorms(r){let men=[[`I. do 30 let`,3000,2800,2600],[`II. 31–35 let`,2950,2700,2500],[`III. 36–40 let`,2850,2600,2400],[`IV. 41–45 let`,2750,2500,2200],[`V. 46–50 let`,2650,2300,2000],[`VI. 51+`,2400,2100,1800]];r.innerHTML=`<div class="app"><div class="wrap">${header('Normy','Běh na 12 minut · '+year)}<table><tr><th>Kategorie</th><th>Výtečné</th><th>Dobré</th><th>Vyhovující</th></tr>${men.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table></div></div>`}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
