<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AČR Cooper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AČR Cooper</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom));background:linear-gradient(#020617,#07111f)}.wrap{max-width:520px;margin:auto}.head{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid #334155}.title{font-size:22px;font-weight:900}.sub{font-size:12px;color:#94a3b8}.back{width:38px;height:38px;border:0;border-radius:50%;background:#1e293b;color:white;font-size:24px}.card{margin:12px 0;padding:16px;border:1px solid #334155;border-radius:22px;background:linear-gradient(#111c2f,#0e1728);box-shadow:0 12px 30px #0005}.menu{display:flex;align-items:center;width:100%;height:70px;margin:10px 0;padding:0 16px;border:1px solid #334155;border-radius:20px;background:#111c2f;color:white;text-align:left;font-size:17px;font-weight:900}.icon{display:grid;place-items:center;width:44px;height:44px;margin-right:12px;border-radius:14px;background:#34d399;color:#022c22}.btn{min-height:49px;padding:0 14px;border:0;border-radius:16px;font-weight:900}.green{background:#34d399;color:#022c22}.red{background:#ef4444;color:white}.gray{background:#334155;color:white}.white{background:white;color:#0f172a}.full{width:100%}.row{display:flex;align-items:center;gap:9px}.grow{flex:1;min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{width:100%;height:49px;padding:0 13px;border:1px solid #475569;border-radius:15px;background:#1e293b;color:white;font-size:16px;outline:none}.field:focus{border-color:#34d399}.label{display:block;margin:12px 0 6px;font-weight:900}.foot{position:fixed;left:0;right:0;bottom:0;padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:#020617ee;border-top:1px solid #334155}.small{font-size:12px;color:#94a3b8}.muted{font-size:13px;color:#cbd5e1}.total{color:#6ee7b7;font-weight:900}.runner{display:flex;align-items:center;gap:10px}.badge{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:0;border-radius:15px;background:#34d399;color:#022c22;font-weight:900}.clock{text-align:center;font:900 clamp(45px,13vw,64px) ui-monospace,monospace}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:54px;border:0;border-radius:15px;background:#334155;color:white;font-size:20px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{height:44px;border:1px solid #475569;border-radius:14px;background:#1e293b;color:white;font-weight:900}.tab.on{background:#34d399;color:#022c22}.display{display:flex;align-items:center;justify-content:center;height:55px;margin:10px 0;border-radius:15px;background:#1e293b;font-size:22px;font-weight:900}.letters{display:flex;flex-direction:column;gap:5px}.letterrow{display:flex;gap:4px}.letter{flex:1;height:40px;border:0;border-radius:8px;background:#334155;color:white;font-weight:900}.match{display:block;width:100%;min-height:45px;margin-top:6px;border:1px solid #475569;border-radius:13px;background:#1e293b;color:white;text-align:left;padding:8px;font-weight:900}.year{width:100%;height:44px;border:1px solid #475569;border-radius:14px;background:#1e293b;color:white;padding:0 12px}.danger{border:0;background:none;color:#f87171;font-weight:900}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#064e3b;color:#6ee7b7;font-size:10px;font-weight:900}.modal{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:20px;background:#020617dd}.modalbox{width:100%;max-width:400px;padding:20px;border:1px solid #475569;border-radius:22px;background:#111c2f}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-top:1px solid #334155;text-align:center}th:first-child,td:first-child{text-align:left}
</style>
</head>
<body><div id="root"></div>
<script>
'use strict';
const K='acr-cooper-pwa-v3';
let tests=JSON.parse(localStorage.getItem(K)||'[]');
let screen='menu',activeId=null,year=+(localStorage.getItem(K+'-year')||2026),timer=null,elapsed=0,startAt=0,inputMode='number',entry='';
const $=id=>document.getElementById(id);
const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2);
const save=()=>localStorage.setItem(K,JSON.stringify(tests));
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmt=ms=>{let h=Math.floor(ms/10),s=Math.floor(h/100);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(h%100).padStart(2,'0')};
const current=()=>tests.find(t=>t.id===activeId);
function head(title,sub,back='menu'){return `<div class="head">${back?`<button class="back" onclick="go('${back}')">‹</button>`:''}<div><div class="title">${title}</div><div class="sub">${sub||''}</div></div></div>`}
function go(s){stopTimer();screen=s;render()}
function setYear(v){year=+v;localStorage.setItem(K+'-year',String(year));render()}
function yearSelect(){return `<select class="year" onchange="setYear(this.value)">${Array.from({length:15},(_,i)=>2026+i).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`}
function render(){const root=$('root');if(screen==='menu')menu(root);else if(screen==='tests')testList(root);else if(screen==='new')newForm(root);else if(screen==='runners')runners(root);else if(screen==='measure')measure(root);else if(screen==='results')results(root);else if(screen==='people')people(root);else if(screen==='norms')norms(root);else settings(root)}
function menu(r){r.innerHTML=`<div class="app"><div class="wrap">${head('AČR Cooper','Běžecké testy','')}${yearSelect()}<div style="text-align:center;font-size:55px;margin:28px">🏃</div>${[['tests','📋','Evidence testů'],['people','👥','Evidence běžců'],['norms','📊','Normy'],['settings','⚙️','Nastavení']].map(x=>`<button class="menu" onclick="go('${x[0]}')"><span class="icon">${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`}
function testList(r){const list=tests.filter(t=>(t.date||'').startsWith(year+'-'));r.innerHTML=`<div class="app"><div class="wrap">${head('Evidence testů','Rok '+year)}${yearSelect()}${list.map(t=>`<div class="card"><button style="all:unset;display:block;width:100%" onclick="activeId='${t.id}';go('${t.status==='finished'?'results':t.runners.length?'measure':'runners'}')"><b>${t.name}</b><div class="small">${t.date} · ${t.trackLength} m · ${t.runners.length} běžců</div></button><div class="row" style="justify-content:space-between;margin-top:6px"><span class="status">${t.status==='finished'?'DOKONČENÝ':'ROZPRACOVANÝ'}</span><button class="danger" onclick="confirmDelete('${t.id}')">Smazat</button></div></div>`).join('')||`<div class="card">Žádný test v roce ${year}.</div>`}</div><div class="foot"><div class="wrap"><button class="btn green full" onclick="go('new')">+ NOVÝ TEST</button></div></div></div>`}
function confirmDelete(id){const t=tests.find(x=>x.id===id);const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Opravdu smazat test?</h3><p>${t.name}</p><div class="grid2"><button class="btn gray" id="cancelDelete">ZRUŠIT</button><button class="btn red" id="doDelete">SMAZAT TEST</button></div></div>`;document.body.appendChild(m);$('cancelDelete').onclick=()=>m.remove();$('doDelete').onclick=()=>{tests=tests.filter(x=>x.id!==id);save();m.remove();render()}}
function newForm(r){r.innerHTML=`<div class="app"><div class="wrap">${head('Nový test','Základní údaje','tests')}<div class="card"><label class="label" for="testName">Název</label><input id="testName" class="field" value="Cooperův test"><label class="label" for="testDate">Datum</label><input id="testDate" class="field" type="date" value="${year}-09-15"><label class="label" for="trackLength">Délka dráhy</label><select id="trackLength" class="field"><option>200</option><option>300</option><option selected>400</option><option>407</option></select></div></div><div class="foot"><div class="wrap"><button id="continueTest" class="btn green full">POKRAČOVAT K BĚŽCŮM</button></div></div></div>`;requestAnimationFrame(()=>{$('continueTest').addEventListener('click',createNewTest)})}
function createNewTest(){const name=$('testName')?.value.trim(),date=$('testDate')?.value,length=Number($('trackLength')?.value);if(!name)return alert('Zadejte název testu.');if(!date)return alert('Vyberte datum.');if(!length)return alert('Vyberte délku dráhy.');const t={id:uid(),name,date,trackLength:length,runners:[],elapsedMs:0,status:'runners',createdAt:Date.now()};tests.push(t);save();activeId=t.id;screen='runners';render()}
function runners(r){const t=current();if(!t)return go('tests');r.innerHTML=`<div class="app"><div class="wrap">${head('Přidat běžce',t.name,'tests')}<div class="card row"><input id="runnerNo" class="field" style="max-width:95px" inputmode="numeric" placeholder="Číslo"><input id="runnerName" class="field" placeholder="Jméno a příjmení"></div><button id="addRunner" class="btn green full">+ PŘIDAT BĚŽCE</button>${t.runners.map(x=>`<div class="card runner"><div class="badge">${x.number}</div><b class="grow">${x.name}</b><button class="danger" onclick="removeRunner('${x.id}')">✕</button></div>`).join('')}</div><div class="foot"><div class="wrap"><button class="btn white full" ${t.runners.length?'':'disabled'} onclick="go('measure')">PŘEJÍT K MĚŘENÍ</button></div></div></div>`;requestAnimationFrame(()=>{$('addRunner').onclick=addRunner})}
function addRunner(){const t=current(),number=$('runnerNo')?.value.trim(),name=$('runnerName')?.value.trim();if(!number||!name)return alert('Vyplňte číslo i jméno běžce.');if(t.runners.some(r=>r.number===number))return alert('Číslo už je použité.');t.runners.push({id:uid(),number,name,laps:0,extraMeters:0,order:t.runners.length});save();render()}
function removeRunner(id){const t=current();t.runners=t.runners.filter(x=>x.id!==id);save();render()}
function startTimer(){if(timer)return;startAt=performance.now()-elapsed;timer=setInterval(()=>{elapsed=performance.now()-startAt;const c=$('clock');if(c)c.textContent=fmt(elapsed)},30)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}const t=current();if(t){t.elapsedMs=Math.floor(elapsed);save()}}
function addLap(id,d=1){const t=current(),x=t.runners.find(r=>r.id===id);x.laps=Math.max(0,x.laps+d);save();measure($('root'))}
function submitEntry(){const t=current();let x;if(inputMode==='number')x=t.runners.find(r=>r.number===entry);else {const m=t.runners.filter(r=>norm(r.name).includes(norm(entry)));if(m.length===1)x=m[0]}if(!x)return alert('Běžec nebyl nalezen.');x.laps++;entry='';save();measure($('root'))}
function measure(r){const t=current();if(!t)return go('tests');elapsed=t.elapsedMs||elapsed;const matches=inputMode==='name'&&entry?t.runners.filter(x=>norm(x.name).includes(norm(entry))).slice(0,6):[];r.innerHTML=`<div class="app"><div class="wrap">${head('Měření',t.name,'runners')}<div class="card"><div id="clock" class="clock">${fmt(elapsed)}</div><div class="grid3"><button class="btn green" onclick="startTimer()">START</button><button class="btn red" onclick="stopTimer()">STOP</button><button class="btn gray" onclick="stopTimer();elapsed=0;t=undefined;current().elapsedMs=0;save();render()">RESET</button></div></div><div class="card"><div class="tabs"><button class="tab ${inputMode==='number'?'on':''}" onclick="inputMode='number';entry='';render()">ČÍSLO</button><button class="tab ${inputMode==='name'?'on':''}" onclick="inputMode='name';entry='';render()">JMÉNO</button></div><div class="display">${entry||'Zadejte '+(inputMode==='number'?'číslo':'jméno')}</div>${inputMode==='number'?`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="entry+='${n}';render()">${n}</button>`).join('')}<button class="key" onclick="entry='';render()">C</button><button class="key" onclick="entry+='0';render()">0</button><button class="key" onclick="entry=entry.slice(0,-1);render()">⌫</button></div>`:`<div class="letters">${[['Q','W','E','R','T','Z','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Y','X','C','V','B','N','M']].map(row=>`<div class="letterrow">${row.map(l=>`<button class="letter" onclick="entry+='${l}';render()">${l}</button>`).join('')}</div>`).join('')}</div>${matches.map(x=>`<button class="match" onclick="entry='${x.name.replaceAll("'","\\'")}';render()">${x.number} · ${x.name}</button>`).join('')}`}<button class="btn green full" style="margin-top:9px" onclick="submitEntry()">PŘIČÍST KOLO</button></div>${t.runners.map(x=>`<div class="card runner"><button class="badge" onclick="addLap('${x.id}')">${x.number}</button><div class="grow"><b>${x.name}</b><div class="total">${x.laps} kol · ${x.laps*t.trackLength} m</div></div><button class="btn gray" onclick="addLap('${x.id}',-1)">−</button><button class="btn green" onclick="addLap('${x.id}')">＋</button></div>`).join('')}</div><div class="foot"><div class="wrap"><button class="btn white full" onclick="stopTimer();current().status='finished';save();go('results')">UKONČIT A VYHODNOTIT</button></div></div></div>`}
function results(r){const t=current();if(!t)return go('tests');r.innerHTML=`<div class="app"><div class="wrap">${head('Výsledky',t.name,'tests')}${t.runners.map(x=>{const total=x.laps*t.trackLength+(+x.extraMeters||0);return `<div class="card"><b>${x.number} · ${x.name}</b><div class="muted">${x.laps} kol × ${t.trackLength} m</div><div class="total">${total} m</div><input class="field" type="number" inputmode="numeric" placeholder="Metry navíc" value="${x.extraMeters||''}" onchange="setExtra('${x.id}',this.value)"></div>`}).join('')}</div><div class="foot"><div class="wrap"><button class="btn green full" onclick="go('tests')">ULOŽIT TEST</button></div></div></div>`}
function setExtra(id,v){const t=current(),x=t.runners.find(r=>r.id===id);x.extraMeters=Math.max(0,Math.min(t.trackLength-1,Number(v)||0));save();render()}
function people(r){const map={};tests.forEach(t=>t.runners.forEach(x=>{const k=norm(x.name),total=x.laps*t.trackLength+(+x.extraMeters||0);(map[k]??={name:x.name,res:[]}).res.push({date:t.date,test:t.name,total})}));const arr=Object.values(map);r.innerHTML=`<div class="app"><div class="wrap">${head('Evidence běžců','Počet běžců: '+arr.length)}${yearSelect()}${arr.map(x=>{const yr=x.res.filter(a=>a.date.startsWith(year+'-'));const best=yr.length?Math.max(...yr.map(a=>a.total)):null;return `<div class="card"><b>${x.name}</b><div class="small">Nejlepší výsledek v roce ${year}</div><div class="total">${best===null?'Bez výsledku':best+' m'}</div><details><summary>Všechny běhy (${x.res.length})</summary>${x.res.sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="row" style="padding:7px 0;border-top:1px solid #334155"><span class="grow">${a.date} · ${a.test}</span><b>${a.total} m</b></div>`).join('')}</details></div>`}).join('')}</div></div>`}
function norms(r){const m=[[`I. do 30 let`,3000,2800,2600],[`II. 31–35 let`,2950,2700,2500],[`III. 36–40 let`,2850,2600,2400],[`IV. 41–45 let`,2750,2500,2200],[`V. 46–50 let`,2650,2300,2000],[`VI. 51+`,2400,2100,1800]];r.innerHTML=`<div class="app"><div class="wrap">${head('Normy','Běh na 12 minut · '+year)}${yearSelect()}<div class="card"><table><tr><th>Kategorie</th><th>Výtečné</th><th>Dobré</th><th>Vyhovující</th></tr>${m.map((x,i)=>`<tr><td>${x[0]}<div class="small">ročník ${i===0?year+'–'+(year-30):''}</div></td><td>${x[1]} m</td><td>${x[2]} m</td><td>${x[3]} m</td></tr>`).join('')}</table></div></div></div>`}
function settings(r){r.innerHTML=`<div class="app"><div class="wrap">${head('Nastavení','Vzhled aplikace')}<div class="card">Tmavý motiv</div></div></div>`}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
</script></body></html>
